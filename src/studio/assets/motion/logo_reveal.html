<style>
.lr { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 46); }
.lr .logo { position: relative; display: grid; place-items: center; }
.lr .logo svg, .lr .logo img { display: block; width: 100%; height: 100%; overflow: visible; }
.lr .tag { font-size: calc(var(--u) * 40); font-weight: 500; color: var(--muted); letter-spacing: .28em; text-transform: uppercase; text-align: center; }
:root[dir=rtl] .lr .tag { letter-spacing: 0; font-size: calc(var(--u) * 46); }
.lr .sweep { position: absolute; inset: -10%; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%);
  mix-blend-mode: overlay; pointer-events: none; }
.lr .ring { position: absolute; left: 50%; top: 50%; border-radius: 50%; border: calc(var(--u) * 6) solid var(--primary); transform: translate(-50%, -50%) scale(0); }
.lr .dot { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * 14); height: calc(var(--u) * 14); margin: calc(var(--u) * -7); border-radius: 50%; background: var(--accent); }
.lr .glow { position: absolute; left: 50%; top: 50%; border-radius: 50%; transform: translate(-50%, -50%);
  background: radial-gradient(closest-side, var(--primary), transparent); opacity: 0; }
</style>
<script>
(() => {
  const style = P.style || 'draw';
  const T = setDuration(P.duration || 4.5);
  backdrop({o1: .22, o2: .14, dur: T});
  const wrap = el('div', 'lr');
  const box = el('div', 'logo', wrap);
  // logo box: fit inside 56% × 34% of the frame (portrait: 70% × 22%) keeping its aspect ratio
  const maxW = W * (PORTRAIT ? 0.72 : 0.56), maxH = H * (PORTRAIT ? 0.22 : 0.34);
  let ar = 1, node;
  if (P.svg) {
    box.innerHTML = P.svg;
    node = box.querySelector('svg');
    const vb = (node.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
    if (vb.length === 4 && vb[2] > 0) ar = vb[2] / vb[3];
    else { const w = parseFloat(node.getAttribute('width')), h = parseFloat(node.getAttribute('height')); if (w && h) { ar = w / h; node.setAttribute('viewBox', `0 0 ${w} ${h}`); } }
    node.removeAttribute('width'); node.removeAttribute('height');
    node.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  } else {
    node = el('img', '', box); node.src = P.logo_uri;
    ar = P.logo_ar || 1;
  }
  let bw = maxW, bh = bw / ar; if (bh > maxH) { bh = maxH; bw = bh * ar; }
  Object.assign(box.style, {width: bw + 'px', height: bh + 'px'});
  const glow = el('div', 'glow', wrap); Object.assign(glow.style, {width: bw * 1.6 + 'px', height: bw * 1.6 + 'px'});
  wrap.insertBefore(glow, box);
  let tag = null, tws = [];
  if (P.tagline) { tag = el('div', 'tag', wrap); tws = words(tag, P.tagline); }
  const HOLD = T - 0.5;
  A(glow, [{opacity: 0, transform: 'translate(-50%,-50%) scale(.6)'}, {opacity: .35, transform: 'translate(-50%,-50%) scale(1)'}], 0.2, 2.2, 'out');

  if (style === 'draw' && P.svg) {
    const shapes = [...node.querySelectorAll('path, circle, rect, ellipse, polygon, polyline, line')]
      .filter(s => !s.closest('defs, clipPath, mask'));
    const n = shapes.length || 1;
    const vb = node.viewBox.baseVal;
    const sw = Math.max(vb.width, vb.height) / 260;
    shapes.forEach((s, i) => {
      const cs = getComputedStyle(s);
      const fill = cs.fill && cs.fill !== 'none' ? cs.fill : null;
      const stroke = cs.stroke && cs.stroke !== 'none' ? cs.stroke : null;
      s.setAttribute('pathLength', '1');
      const strokeCol = stroke || (fill && !/url\(/.test(fill) ? fill : C.text);
      s.style.stroke = strokeCol; s.style.strokeWidth = stroke ? cs.strokeWidth : sw;
      s.style.strokeDasharray = '1 1'; s.style.strokeLinecap = 'round'; s.style.strokeLinejoin = 'round';
      const d0 = 0.15 + (i / n) * 0.9, dd = Math.min(1.6, 0.9 + 0.6 * (1 - i / n));
      A(s, [{strokeDashoffset: 1}, {strokeDashoffset: 0}], d0, dd, 'inOut3');
      if (fill) {
        A(s, [{fillOpacity: 0}, {fillOpacity: 1}], 1.25 + (i / n) * 0.5, 0.7, 'out');
        if (!stroke) AO(s, [{strokeOpacity: 1}, {strokeOpacity: 0}], 1.7 + (i / n) * 0.5, 0.5, 'out');
      }
    });
    node.querySelectorAll('text').forEach((t, i) => A(t, [{opacity: 0}, {opacity: 1}], 1.2 + i * 0.1, 0.8, 'out'));
    A(box, [{transform: 'scale(.94)'}, {transform: 'scale(1)'}], 0, HOLD, 'out3');
  } else if (style === 'mask') {
    const R = Math.hypot(bw, bh) / 2 + 20;
    A(box, [{clipPath: 'circle(0px at 50% 50%)'}, {clipPath: `circle(${R}px at 50% 50%)`}], 0.25, 1.1, 'inOut');
    A(box, [{transform: 'scale(1.18)', filter: `blur(${10 * U}px)`}, {transform: 'scale(1)', filter: 'blur(0)'}], 0.25, 1.4, 'out');
    const ring = el('div', 'ring', wrap); wrap.insertBefore(ring, box);
    Object.assign(ring.style, {width: R * 2 + 'px', height: R * 2 + 'px'});
    A(ring, [{transform: 'translate(-50%,-50%) scale(0)', opacity: 1}, {transform: 'translate(-50%,-50%) scale(1.05)', opacity: 1}], 0.2, 1.1, 'inOut');
    AO(ring, [{opacity: 1, transform: 'translate(-50%,-50%) scale(1.05)'}, {opacity: 0, transform: 'translate(-50%,-50%) scale(1.35)'}], 1.3, 0.7, 'out');
    const sw = el('div', 'sweep', box);
    A(sw, [{transform: 'translateX(-120%)'}, {transform: 'translateX(120%)'}], 1.5, 1.1, 'inOut3');
  } else { // pop
    A(box, [{transform: 'scale(0)', opacity: 0}, {transform: 'scale(1.08)', opacity: 1, offset: .6}, {transform: 'scale(.98)', offset: .8}, {transform: 'scale(1)', opacity: 1}], 0.25, 1.0, 'out3');
    const R = Math.max(bw, bh) * 0.62;
    for (let k = 0; k < 2; k++) {
      const ring = el('div', 'ring', wrap); wrap.insertBefore(ring, box);
      Object.assign(ring.style, {width: R * 2 + 'px', height: R * 2 + 'px', borderColor: k ? C.accent : C.primary, borderWidth: (k ? 3 : 6) * U + 'px'});
      A(ring, [{transform: 'translate(-50%,-50%) scale(.3)', opacity: 1}, {transform: `translate(-50%,-50%) scale(${1.25 + k * .35})`, opacity: 0}], 0.35 + k * 0.12, 1.0, 'out');
    }
    const N = 14;
    for (let i = 0; i < N; i++) {
      const d = el('div', 'dot', wrap);
      const a = (i / N) * Math.PI * 2 + 0.3, r = R * (1.15 + (i % 3) * 0.18);
      if (i % 2) d.style.background = C.primary;
      A(d, [{transform: 'translate(0,0) scale(1)', opacity: 1}, {transform: `translate(${Math.cos(a) * r}px, ${Math.sin(a) * r}px) scale(.2)`, opacity: 0}], 0.4, 0.9, 'out');
    }
  }
  if (tag) {
    const tBase = style === 'draw' ? 1.9 : 1.2;
    tws.forEach((w, i) => A(w.inner, [{transform: 'translateY(105%)', opacity: 0}, {transform: 'none', opacity: 1}], tBase + i * 0.08, 0.8, 'out'));
    A(tag, [{letterSpacing: RTL ? '0' : '.5em'}, {letterSpacing: RTL ? '0' : '.28em'}], tBase, 1.6, 'out');
  }
  if (P.fade_out) AO(wrap, [{opacity: 1}, {opacity: 0}], HOLD, 0.5, 'in');
})();
</script>
