[project]
name = "studio-mcp"
version = "0.1.0"
description = "A full creative team for AI agents, built only on free tools: design, branding, vector, photo editing, video editing, motion graphics, AI image/video generation and audio — controllable from any MCP client or a plain CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joshua George" }]
dependencies = [
  "mcp>=1.10,<2",
  "pillow>=10",
  "numpy>=1.26",
]

[project.optional-dependencies]
design = ["playwright>=1.45", "uharfbuzz>=0.39", "fonttools>=4.47", "brotli>=1.1", "segno>=1.6"]
photo = ["rembg[cpu]>=2.0.60", "opencv-python-headless>=4.9"]
vector = ["vtracer>=0.6"]
video = ["opencv-python-headless>=4.9", "playwright>=1.45", "fonttools>=4.47", "soundfile>=0.12"]
motion = ["playwright>=1.45"]
audio = ["edge-tts>=6.1", "faster-whisper>=1.0", "noisereduce>=3.0", "soundfile>=0.12", "pedalboard>=0.9",
         "piper-tts>=1.2", "mido>=1.3", "scipy>=1.11"]
stems = ["demucs>=4.0"]
mac = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
all = ["studio-mcp[design,photo,vector,video,motion,audio]"]
dev = ["pytest>=8", "psd-tools>=1.9"]

[project.scripts]
studio = "studio.cli:main"
studio-mcp = "studio.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renders real media (seconds to minutes)", "needs(tool): requires an external program"]
